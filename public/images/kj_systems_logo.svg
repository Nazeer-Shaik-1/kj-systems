<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Rich emerald-to-teal gradient matching brand identity -->
    <linearGradient id="kjBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Vibrant emerald shine for medical pulse/cross accent -->
    <linearGradient id="kjAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle inner drop glow -->
    <filter id="kjGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern squircle rounded container -->
  <rect width="48" height="48" rx="12" fill="url(#kjBgGrad)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Monogram KJ with Integrated Health Systems Architecture -->
  <g filter="url(#kjGlow)">
    <!-- Letter K: Left Vertical Pillar -->
    <rect x="9.5" y="10" width="4" height="28" rx="2" fill="#FFFFFF" />

    <!-- Letter K: Top Diagonal Arm -->
    <path
      d="M13.5 22.5 L22.8 11.8 C23.6 10.9 25 10.9 25.8 11.8 C26.6 12.7 26.5 14 25.6 14.9 L18.2 24.2 L13.5 22.5 Z"
      fill="#FFFFFF"
    />

    <!-- Letter K: Bottom Diagonal Arm (intertwining into center) -->
    <path
      d="M16 21.5 L24.8 34.2 C25.6 35.2 27 35.4 28 34.6 C28.9 33.8 29.1 32.4 28.3 31.4 L20.5 20 L16 21.5 Z"
      fill="#FFFFFF"
    />

    <!-- Letter J: Vertical Stem & Elegant Bottom Hook -->
    <path
      d="M34 10 C35.1 10 36 10.9 36 12 L36 27 C36 32.8 31.5 37.5 25.8 37.5 C24.2 37.5 22.8 37.1 21.5 36.4 C20.3 35.8 19.9 34.2 20.6 33 C21.3 31.8 22.8 31.4 24 32 C24.6 32.3 25.2 32.5 25.8 32.5 C29 32.5 31 30.2 31 27 L31 12 C31 10.9 31.9 10 33 10 Z"
      fill="#FFFFFF"
    />

    <!-- Healthcare Cross / Systems Core Accent (+ node uniting K and J) -->
    <g transform="translate(23.5, 20)">
      <!-- Horizontal bar of health cross -->
      <rect x="-3" y="-1" width="6" height="2" rx="1" fill="url(#kjAccent)" />
      <!-- Vertical bar of health cross -->
      <rect x="-1" y="-3" width="2" height="6" rx="1" fill="url(#kjAccent)" />
      <!-- Central glowing core -->
      <circle cx="0" cy="0" r="0.9" fill="#FFFFFF" />
    </g>
  </g>
</svg>